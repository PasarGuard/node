# Include inside nginx's http {} block. Change certificate paths and ports together.
server {
    listen 62050 ssl;
    server_name node.example.com;
    ssl_certificate /etc/pg-node-tls/fullchain.pem;
    ssl_certificate_key /etc/pg-node-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:62150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
