# PasarGuard OpenVPN core — generated by the node, do not edit.
# Secrets live in 0600 files next to this one, never in this file.

dev tun
topology subnet
port 1194
proto udp
server 10.8.0.0 255.255.255.0

ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt tls-crypt.key
tls-version-min 1.2
tls-cipher TLS-ECDHE-ECDSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
data-ciphers AES-256-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-256-GCM
auth SHA256
allow-compression no

verify-client-cert none
username-as-common-name
script-security 2
auth-user-pass-verify /usr/local/bin/pg-ovpn-auth via-file
client-config-dir ccd
ccd-exclusive

management /var/lib/pg-node/generated/core-1/mgmt.sock unix /var/lib/pg-node/generated/core-1/mgmt.pw

push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 1.0.0.1"
push "redirect-gateway def1 bypass-dhcp"

keepalive 10 120
persist-key
persist-tun
explicit-exit-notify 1
status status.log 10
verb 3
